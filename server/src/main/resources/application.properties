server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/meeting_planner_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

app.base-url=${APP_BASE_URL:https://meetingplanner.example.com}

app.email.enabled=${EMAIL_ENABLED:false}
app.email.host=${MAIL_SMTP_HOST:}
app.email.port=${MAIL_SMTP_PORT:587}
app.email.username=${MAIL_SMTP_USERNAME:}
app.email.password=${MAIL_SMTP_PASSWORD:}
app.email.from=${MAIL_FROM:meetingplanner@localhost}
app.email.drain-delay-ms=${EMAIL_DRAIN_DELAY_MS:30000}

app.reminder.delay-ms=${REMINDER_DELAY_MS:60000}

app.meeting.cleanup-cron=${MEETING_CLEANUP_CRON:0 0 3 * * *}
app.meeting.start-grace-minutes=${MEETING_START_GRACE_MINUTES:5}
app.meeting.time-change-deadline-hours=${MEETING_TIME_CHANGE_DEADLINE_HOURS:48}
app.meeting.time-change-expiry-delay-ms=${MEETING_TIME_CHANGE_EXPIRY_DELAY_MS:300000}
app.default-timezone=${DEFAULT_TIMEZONE:UTC}

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s